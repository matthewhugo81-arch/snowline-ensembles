name: Refresh MOGREPS and publish Snowline
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 */3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: snowline-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test chart calculations and source decoder
        run: npm test
      - name: Install source indexer
        run: pip install -r scripts/requirements.txt
      - name: Test source index validation
        run: python tests/test_index_mogreps.py
      - name: Restore recent source indexes
        uses: actions/cache/restore@v4
        with:
          path: docs/mogreps
          key: mogreps-v1-${{ github.run_id }}
          restore-keys: mogreps-v1-
      - name: Index newest complete Met Office run
        id: index
        run: python scripts/index_mogreps.py --workers 24
      - name: Cache indexed runs
        uses: actions/cache/save@v4
        with:
          path: docs/mogreps
          key: mogreps-v1-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to existing GitHub Pages URL
        id: deployment
        uses: actions/deploy-pages@v4
