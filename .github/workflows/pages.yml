name: Refresh MOGREPS and publish Snowline
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_freshness:
        description: Only build when source data or unfinished chart hours need publication
        type: boolean
        default: false
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: snowline-pages
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      refresh: ${{ steps.source.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check complete official cycles independently of the published index
        id: source
        if: github.event_name == 'schedule' || inputs.check_freshness == true
        run: python scripts/check_index_freshness.py
  build:
    needs: freshness
    if: (github.event_name != 'schedule' && inputs.check_freshness != true) || needs.freshness.outputs.refresh == 'true'
    outputs:
      changed: ${{ steps.publication.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test chart calculations and source decoder
        run: npm test
      - name: Install source indexer
        run: pip install -r scripts/requirements.txt
      - name: Test source index validation
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Restore recent source indexes
        uses: actions/cache/restore@v4
        with:
          path: docs/mogreps
          key: mogreps-v1-${{ github.run_id }}
          restore-keys: mogreps-v1-
      - name: Finish the published partial run before advancing
        id: target
        run: python scripts/select_map_run.py >> "$GITHUB_OUTPUT"
      - name: Index required complete Met Office run
        id: index
        env:
          MOGREPS_RUN: ${{ steps.target.outputs.run }}
        run: |
          args=()
          if [ -n "$MOGREPS_RUN" ]; then args+=(--run "$MOGREPS_RUN"); fi
          python scripts/index_mogreps.py --workers 24 "${args[@]}"
      - name: Cache indexed runs
        uses: actions/cache/save@v4
        with:
          path: docs/mogreps
          key: mogreps-v1-${{ github.run_id }}
      - name: Check out verified map importers
        uses: actions/checkout@v4
        with:
          repository: matthewhugo81-arch/snowline
          ref: a6ed1702c5c605c9d17dd1a60fd7c06d085e632c
          path: map-importer
      - name: Install map conversion tools
        run: pip install -r map-importer/scripts/ensemble-requirements.txt
      - name: Verify map importers
        run: |
          python -m unittest discover -s map-importer/tests -p 'test_mogreps*.py'
          python -m unittest discover -s map-importer/tests -p 'test_vertical*.py'
      - name: Restore companion grids
        uses: actions/cache@v4
        with:
          path: docs/ensemble-data
          key: companion-grids-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: companion-grids-v1-
      # The verified fixed baseline stays outside the public site tree.
      - uses: actions/cache@v4
        with:
          path: climatology-cache
          key: mogreps-climatology-500hpa-1991-2020-v1
      - name: Prepare verified NOAA climatology from the independent bulk archive
        continue-on-error: true
        run: python map-importer/scripts/mogreps_climatology_cache.py
      - name: Prepare native GEM upper air and MOGREPS comparison grids
        run: |
          python map-importer/scripts/build_gem_upper.py --model gem --output docs/ensemble-data --workers 6 &
          gem=$!
          python map-importer/scripts/build_mogreps_global.py --output docs/ensemble-data --index-root docs/mogreps --workers 8 --range-workers 8 --comparison-frames 24 &
          mogreps=$!
          failed=0
          wait "$gem" || failed=1
          wait "$mogreps" || failed=1
          exit "$failed"
      - name: Publish early UKMO hours from the direct free Met Office feed
        timeout-minutes: 8
        continue-on-error: true
        run: python scripts/build_ukmo_early.py --output docs/ensemble-data --workers 4
      - name: Retain complete additional ensemble runs
        run: python scripts/retain_map_runs.py
      - name: Assemble binary-safe companion publication
        run: |
          python -c "from pathlib import Path; [p.unlink() for p in Path('docs/ensemble-data/snowline_ukmo_early').rglob('*.tmp')]"
          cp -a docs _site
          python -c "from pathlib import Path; [p.rename(p.with_suffix('.om.png')) for p in Path('_site/ensemble-data').rglob('*.om')]"
          python -c "from pathlib import Path; n=sum(p.stat().st_size for p in Path('_site').rglob('*') if p.is_file()); print(f'Published files: {n} bytes'); assert n < 1000000000, 'Publication exceeds the 1 GB hosting limit'"
      - name: Skip uploads when the actual forecast content is unchanged
        id: publication
        run: python map-importer/scripts/publication_manifest.py _site --live-url https://matthewhugo81-arch.github.io/snowline-ensembles/publication.json
      - uses: actions/configure-pages@v5
        if: steps.publication.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.publication.outputs.changed == 'true'
        with:
          path: _site
  deploy:
    if: needs.build.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to existing GitHub Pages URL
        id: deployment
        uses: actions/deploy-pages@v4
