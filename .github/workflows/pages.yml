name: Refresh MOGREPS and publish Snowline
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: snowline-pages
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      refresh: ${{ steps.source.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check complete official cycles independently of the published index
        id: source
        if: github.event_name == 'schedule'
        run: python scripts/check_index_freshness.py
  build:
    needs: freshness
    if: github.event_name != 'schedule' || needs.freshness.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test chart calculations and source decoder
        run: npm test
      - name: Install source indexer
        run: pip install -r scripts/requirements.txt
      - name: Test source index validation
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Restore recent source indexes
        uses: actions/cache/restore@v4
        with:
          path: docs/mogreps
          key: mogreps-v1-${{ github.run_id }}
          restore-keys: mogreps-v1-
      - name: Index newest complete Met Office run
        id: index
        run: python scripts/index_mogreps.py --workers 24
      - name: Cache indexed runs
        uses: actions/cache/save@v4
        with:
          path: docs/mogreps
          key: mogreps-v1-${{ github.run_id }}
      - name: Check out verified map importers
        uses: actions/checkout@v4
        with:
          repository: matthewhugo81-arch/snowline
          ref: 2cc6d78f29790763f36c16b84b2dfe099cd345b7
          path: map-importer
      - name: Install map conversion tools
        run: pip install -r map-importer/scripts/ensemble-requirements.txt
      - name: Verify map importers
        run: |
          python -m unittest discover -s map-importer/tests -p 'test_mogreps*.py'
          python -m unittest discover -s map-importer/tests -p 'test_vertical*.py'
      - name: Restore companion grids
        uses: actions/cache@v4
        with:
          path: docs/ensemble-data
          key: companion-grids-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: companion-grids-v1-
      - name: Prepare native GEM upper air and MOGREPS comparison grids
        run: |
          python map-importer/scripts/build_gem_upper.py --model gem --output docs/ensemble-data --workers 6 &
          gem=$!
          python map-importer/scripts/build_mogreps_global.py --output docs/ensemble-data --index-root docs/mogreps --workers 8 --range-workers 8 --comparison-frames 24 &
          mogreps=$!
          failed=0
          wait "$gem" || failed=1
          wait "$mogreps" || failed=1
          exit "$failed"
      - name: Assemble binary-safe companion publication
        run: |
          cp -a docs _site
          python -c "from pathlib import Path; [p.rename(p.with_suffix('.om.png')) for p in Path('_site/ensemble-data').rglob('*.om')]"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to existing GitHub Pages URL
        id: deployment
        uses: actions/deploy-pages@v4
